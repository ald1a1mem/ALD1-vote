<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>推播連線測試</title>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }
    button {
      width: 100%;
      padding: 14px 18px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: #DF9F97;
      color: #fff;
      cursor: pointer;
    }
    .box {
      margin-top: 20px;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h2>推播單獨測試頁</h2>
  <p>先按下面這顆按鈕，看看瀏覽器有沒有跳出通知權限，以及有沒有拿到編號。</p>
  <button id="btnTest" type="button">點我開啟推播測試</button>
  <div class="box" id="logBox">狀態：正在準備推播工具...</div>

  <script>
    const APP_ID = "a9d9082b-0e43-4ba1-b5fb-9f444247f0f8";
    const logBox = document.getElementById("logBox");
    const btnTest = document.getElementById("btnTest");

    let ready = false;
    let sdkRef = null;

    function showMsg(text) {
      logBox.textContent = text;
    }

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        sdkRef = OneSignal;
        await OneSignal.init({
          appId: APP_ID,
          allowLocalhostAsSecureOrigin: true,
          serviceWorkerParam: { scope: "/ALD1-vote/" },
          serviceWorkerPath: "/ALD1-vote/OneSignalSDKWorker.js"
        });
        ready = true;
        showMsg("狀態：推播工具已準備好！請點上面的按鈕。");
      } catch (e) {
        showMsg("初始化失敗：\n" + (e && e.message ? e.message : String(e)));
      }
    });

    btnTest.addEventListener("click", async () => {
      if (!ready || !sdkRef) {
        showMsg("目前還在準備推播工具，如果等 5 秒都沒變，可能是被瀏覽器或網路擋住了。");
        return;
      }

      try {
        showMsg("狀態：正在要求通知權限與登記...");
        if (!sdkRef.Notifications.permission) {
          await sdkRef.Notifications.requestPermission();
        }

        if (!sdkRef.Notifications.permission) {
          showMsg("還沒拿到通知權限！\n請看瀏覽器有沒有跳出『允許』，或是去瀏覽器設定裡確認沒有封鎖通知。");
          return;
        }

        await sdkRef.User.PushSubscription.optIn();
        const subId = sdkRef.User.PushSubscription.id;

        showMsg(
          "完成！\n" +
          "通知權限：已允許\n" +
          "訂閱編號 (ID)：" + (subId || "尚未產生，請再按一次或重新整理")
        );
      } catch (e) {
        showMsg("登記時發生錯誤：\n" + (e && e.message ? e.message : String(e)));
      }
    });
  </script>
</body>
</html>
